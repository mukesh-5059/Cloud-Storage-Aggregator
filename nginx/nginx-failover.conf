events {
    worker_connections 1024;
}

http {
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                           'status=$status upstream=$upstream_addr time=${request_time}s';

    access_log /var/log/nginx/access.log upstream_log;
    error_log /var/log/nginx/error.log warn;

    upstream backend_cluster {
        server backend1:8000 max_fails=2 fail_timeout=2s;
        server backend2:8000 max_fails=2 fail_timeout=2s;
        server backend3:8000 max_fails=2 fail_timeout=2s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Failover Configuration
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Backend-Server $upstream_addr always;
        }

        location /nginx_status {
            stub_status;
        }
    }
}
