events {
    worker_connections 1024;
}

http {
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                           'status=$status upstream=$upstream_addr time=${request_time}s';

    access_log /var/log/nginx/access.log upstream_log;
    error_log /var/log/nginx/error.log warn;

    upstream backend_cluster {
        server backend1:8000;
        server backend2:8000;
        server backend3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Failover disabled: requests to dead container will fail with 502
            proxy_next_upstream off;

            add_header X-Backend-Server $upstream_addr always;
        }

        location /nginx_status {
            stub_status;
        }
    }
}
