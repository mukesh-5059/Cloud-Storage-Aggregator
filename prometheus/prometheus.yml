global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'backends'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend1:8000', 'backend2:8000', 'backend3:8000']
